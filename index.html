:root{--ink:#192044;--line:#273354;--cream:#fff8d8;--blue:#7ba5c2}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:18px;background:#81cddd;background-image:radial-gradient(#dffbff 1px,transparent 2px);background-size:18px 18px;font-family:Kanit,sans-serif;color:var(--line)}.game{width:min(1030px,100%);overflow:hidden;border:7px solid var(--ink);background:var(--cream);box-shadow:10px 12px #34436d}header{height:77px;display:flex;align-items:center;justify-content:space-between;padding:11px 17px;background:var(--ink);color:#fff;gap:10px}.brand{display:flex;gap:11px;align-items:center}.logo{width:35px;height:42px;border:4px solid #fff4c0;border-top:0;background:#ff92ad;clip-path:polygon(35% 0,65% 0,65% 34%,100% 100%,0 100%,35% 34%)}h1{margin:0;font:clamp(10px,1.7vw,15px)/1.5 'Press Start 2P'}.sub{font-size:13px;color:#bbc9ff}.stats{display:flex;gap:6px}.chip,.music{padding:5px 8px;border:2px solid #92a0df;background:#434f92;color:#fff9d1;font:700 13px Kanit;white-space:nowrap}.music{cursor:pointer}.world{position:relative;height:min(70vw,570px);min-height:440px;overflow:hidden;background:#c9ebb6;background-image:linear-gradient(#9dcea2 3px,transparent 3px),linear-gradient(90deg,#9dcea2 3px,transparent 3px);background-size:42px 42px}.wall{position:absolute;background:#789cbd;border:4px solid #3c6086;box-shadow:inset 4px 4px #cbe2ef,inset -4px -4px #537799}.top{inset:0 0 auto;height:69px}.left{inset:0 auto 0 0;width:46px}.right{inset:0 0 0 auto;width:46px}.bottom{inset:auto 0 0;height:45px}.roomtitle{position:absolute;left:50%;top:22px;transform:translateX(-50%);font:10px 'Press Start 2P';color:#fff;white-space:nowrap;text-shadow:2px 2px #3e5f80}.bench{position:absolute;background:#bd7b52;border:4px solid #704533;box-shadow:inset 4px 4px #e9b27f,inset -4px -4px #91543a}.bench.a{left:8%;top:23%;width:24%;height:16%}.bench.b{right:8%;top:23%;width:24%;height:16%}.bench.c{left:38%;bottom:12%;width:25%;height:14%}.station{position:absolute;z-index:4;width:67px;height:70px;cursor:pointer;filter:drop-shadow(3px 4px #526c5e)}.station .bottle{position:absolute;left:17px;top:0;width:33px;height:44px;border:4px solid #283754;border-top:10px solid #e9e4d6;background:var(--liquid);box-shadow:inset 5px 0 #ffffff66}.station .bottle:before{content:'';position:absolute;left:7px;top:-17px;width:11px;height:8px;background:#eee8d7;border:3px solid #283754}.station .bottle:after{content:'';position:absolute;inset:8px 4px 4px;background:#ffffff33}.station span{position:absolute;left:-8px;top:48px;width:83px;padding:1px;background:#2d4d73;border:2px solid #1b3150;color:#fff;text-align:center;font-size:11px}.station.done{opacity:.55;filter:grayscale(1)}.station.done:after{content:'✓';position:absolute;right:-5px;top:-7px;width:23px;height:23px;background:#42ae70;border:3px solid #1b6244;color:#fff;text-align:center;font-weight:bold}.s1{left:17%;top:27%;--liquid:#fb849d}.s2{right:17%;top:27%;--liquid:#63aaf0}.s3{left:47%;bottom:17%;--liquid:#ffd268}.stairs{position:absolute;right:7%;bottom:5%;width:78px;height:68px;border:5px solid #504b69;background:repeating-linear-gradient(#bbb7d0 0 9px,#77718e 9px 14px);cursor:pointer}.stairs:after{content:'NEXT';position:absolute;left:2px;top:-26px;padding:3px;background:#77718e;border:3px solid #504b69;color:#fff;font:9px 'Press Start 2P'}.stairs.locked{filter:grayscale(1);opacity:.55}.stairs.locked:before{content:'🔒';position:absolute;left:21px;top:16px;font-size:27px}.npc{display:none;position:absolute;right:13%;bottom:18%;z-index:6;width:54px;height:74px;cursor:pointer;filter:drop-shadow(3px 4px #526c5e)}.npc.show{display:block}.npc .nh{position:absolute;left:5px;top:0;width:43px;height:32px;background:#674e69;border:5px solid #26334e;clip-path:polygon(0 100%,0 20%,25% 15%,32% 0,76% 0,100% 26%,100% 100%,75% 76%,53% 100%,30% 76%,10% 89%)}.npc .nf{position:absolute;left:12px;top:17px;width:29px;height:25px;background:#ffd2a0;border:4px solid #26334e}.npc .nc{position:absolute;left:8px;top:42px;width:36px;height:25px;background:#fffdf5;border:4px solid #26334e}.npc label{position:absolute;top:68px;left:-16px;width:86px;background:#2d4d73;border:2px solid #1b3150;color:white;text-align:center;font-size:10px}#hero{position:absolute;z-index:8;left:50%;top:58%;width:63px;height:78px;transform:translate(-50%,-50%);filter:drop-shadow(3px 4px #52645e);will-change:left,top}#hero i{position:absolute;display:block}.hh{z-index:2;left:5px;top:0;width:53px;height:37px;background:#6c516b;border:5px solid #26324e;clip-path:polygon(0 79%,0 23%,19% 22%,28% 3%,76% 3%,100% 28%,100% 91%,78% 78%,66% 100%,51% 82%,34% 100%,20% 78%,8% 91%)}.face{z-index:3;left:13px;top:18px;width:38px;height:33px;background:#ffd6aa;border:4px solid #26324e}.eye{z-index:4;top:29px;width:7px;height:9px;background:#26324e}.e1{left:23px}.e2{left:39px}.eye:after{content:'';position:absolute;left:2px;top:1px;width:2px;height:2px;background:white}.smile{z-index:4;left:29px;top:41px;width:8px;border-bottom:2px solid #cd6b7b}.coat{z-index:2;left:10px;top:50px;width:43px;height:25px;background:#fffdf5;border:5px solid #26324e}.coat:after{content:'';position:absolute;left:17px;top:-5px;height:21px;border-left:4px solid #ec7897}.book{z-index:5;right:-5px;top:55px;width:21px;height:18px;background:#ffd07a;border:4px solid #26324e;transform:rotate(-12deg)}.tip{position:absolute;z-index:12;left:50%;bottom:12px;transform:translateX(-50%);padding:7px 11px;border:3px solid #172842;background:#273f64ed;color:white;font-weight:700;text-align:center;white-space:nowrap}.modal{position:absolute;z-index:30;inset:0;display:grid;place-items:center;padding:16px;background:#131b3c9c}.card{width:min(610px,100%);max-height:94%;overflow:auto;padding:21px;text-align:center;background:#fff9df;border:5px solid #182043;box-shadow:8px 8px #34446f}.mini{font:10px 'Press Start 2P';color:#5870aa}.card h2{font-size:25px;line-height:1.18}.formula{margin:10px 0;padding:10px;background:#ddfaf2;border:3px solid #57bda8;font:14px/1.6 'Press Start 2P'}.actions{display:grid;gap:8px}.choice,button{cursor:pointer;padding:10px;border:3px solid #26365e;background:#527cd0;color:#fff;font:700 16px Kanit;box-shadow:3px 3px #26365e}.choice{background:white;color:#26365e;text-align:left}.correct{background:#42ae70!important;color:white!important}.wrong{background:#e75f75!important;color:white!important}.feedback{height:28px;font-weight:bold}.footer{padding:8px 16px;background:#fff3c4;border-top:4px solid #d8c786;font-size:13px}.footer b{color:#3d579d}@media(max-width:650px){body{padding:7px}.game{border-width:5px}.sub{display:none}.chip,.music{font-size:11px;padding:4px}.stats{gap:4px}.tip{white-space:normal;max-width:72%;bottom:4px;font-size:12px}.world{min-height:390px}.card h2{font-size:21px}}
</style></head><body><main class="game"><header><div class="brand"><div class="logo"></div><div><h1>pH PIXEL LAB ADVENTURE</h1><div class="sub">กดค้าง WASD / ลูกศร เพื่อเดิน · 30 ห้อง 90 ภารกิจ</div></div></div><div class="stats"><span class="chip">ห้อง <b id="lv">1</b>/30</span><span class="chip">ข้อ <b id="prog">0</b>/3</span><span class="chip">⭐ <b id="score">0</b></span><button class="music" id="music">♫ เพลง: ปิด</button></div></header><section class="world"><i class="wall top"></i><i class="wall left"></i><i class="wall right"></i><i class="wall bottom"></i><div class="roomtitle">CHEMISTRY QUEST LAB</div><i class="bench a"></i><i class="bench b"></i><i class="bench c"></i><div class="station s1" data-s="0"><i class="bottle"></i><span>สารตัวอย่าง A</span></div><div class="station s2" data-s="1"><i class="bottle"></i><span>สารตัวอย่าง B</span></div><div class="station s3" data-s="2"><i class="bottle"></i><span>ขวดปริศนา</span></div><div id="npc" class="npc"><i class="nh"></i><i class="nf"></i><i class="nc"></i><label>ดร. ไอออน</label></div><div id="stairs" class="stairs locked"></div><div id="hero"><i class="hh"></i><i class="face"></i><i class="eye e1"></i><i class="eye e2"></i><i class="smile"></i><i class="coat"></i><i class="book"></i></div><div id="tip" class="tip">เริ่มเกมก่อน แล้วเดินไปที่สารตัวอย่าง A</div><div id="modal" class="modal"><div id="card" class="card"></div></div></section><div class="footer"><b>เนื้อหาหลัก:</b> pH, pOH, [H⁺], [OH⁻] — ไฮโดรไลซิสและการสะเทินใช้เป็นเงื่อนไขของโจทย์</div></main>
<script>
const acids=['HCl','HNO₃','HBr','HClO₄','H₂SO₄','CH₃COOH','HF','H₂CO₃','H₃PO₄','HCOOH'],bases=['NaOH','KOH','LiOH','Ba(OH)₂','Ca(OH)₂','NH₃','CH₃NH₂','Mg(OH)₂','Sr(OH)₂','C₂H₅NH₂'],salts=['CH₃COONa','Na₂CO₃','NH₄Cl','AlCl₃','NaF','NH₄CH₃COO','NaCN','FeCl₃','KNO₂','NaHCO₃'],places=['น้ำยาล้างแก้ว','ตัวอย่างแม่น้ำ','บัฟเฟอร์ในเซลล์','สารกันเสียอาหาร','น้ำยาเคลือบโลหะ','น้ำหมักทดลอง','น้ำยาล้างคราบ','สารละลายปุ๋ย','ตัวอย่างน้ำฝน','สารสกัดพืช','น้ำในบ่อเลี้ยงปลา','น้ำยาฆ่าเชื้อ','ตัวอย่างดิน','น้ำเสียโรงงาน','ยาลดกรด','น้ำยาดองผัก','น้ำยาทำความสะอาด','น้ำพุร้อน','ตัวอย่างฝนกรด','สารเติมแต่งอาหาร','น้ำยาสระผม','ตัวอย่างเตาไฟฟ้า','สารละลายยา','น้ำในแล็บชีวะ','ตัวอย่างนม','น้ำล้างอุปกรณ์','สารในเซลล์เชื้อเพลิง','น้ำในตู้ปลา','น้ำยาชุบโลหะ','ตัวอย่างสุดท้าย'];
let level=1,step=0,score=0,locked=true,clue=false,pos={x:50,y:58},keys={},ctx,musicTimer;const $=s=>document.querySelector(s),modal=$('#modal'),card=$('#card'),tip=$('#tip'),hero=$('#hero'),spots=[[20,32],[80,32],[50,75]];
function id(){return (level-1)*3+step}function power(i,shift=0){return 1+((i*5+shift)%12)}function makeQ(){let i=id(),n=power(i),a=acids[i%acids.length],b=bases[(i*3)%bases.length],salt=salts[(i*7)%salts.length],site=places[Math.floor(i/3)],type=Math.floor(i/3);if(level>=24&&step===2){let fact=['สารนี้แตกตัวสมบูรณ์','การทดลองอยู่ที่ 25°C','เกลือนี้ไฮโดรไลซิสให้ OH⁻','เกลือนี้ไฮโดรไลซิสให้ H⁺','หลังจุดสมมูลเหลือ OH⁻','หลังเจือจางใช้ปริมาตรรวมแล้ว'][level%6];let ans=level%2?14-n:n;return{title:'ขวดปริศนาระดับสูง',data:`${site}: ขวดรหัส X-${level}`,text:`หลังรับข้อมูลจาก NPC วัดได้ค่า ${level%2?'[OH⁻]':'[H⁺]'} = 10⁻${n} M จงหาค่า pH`,ans,need:true,fact}}if(type<10){let modes=[{d:`${site}: [H⁺] = 10⁻${n} M`,t:'จงหาค่า pH',a:n},{d:`${site}: pH = ${n}`,t:'จงหาความเข้มข้น [H⁺]',a:`10⁻${n} M`},{d:`${site}: [OH⁻] = 10⁻${n} M`,t:'จงหาค่า pOH',a:n}];return{title:'พื้นฐานการคำนวณ',data:modes[step].d,text:modes[step].t,ans:modes[step].a}}if(type<20){let modes=[{d:`${site}: ${a} เป็นกรดแก่ หลังเจือจางมี [H⁺] = 10⁻${n} M`,t:'จงหาค่า pH',a:n},{d:`${site}: ${b} ให้ [OH⁻] = 10⁻${n} M`,t:'ที่ 25°C จงหาค่า pH',a:14-n},{d:`${site}: ${salt} ไฮโดรไลซิสแล้ววัด [OH⁻] = 10⁻${n} M`,t:'จงหาค่า pOH',a:n}];return{title:'กรด–เบสในสถานการณ์',data:modes[step].d,text:modes[step].t,ans:modes[step].a}}let modes=[{d:`${site}: ไตเตรต ${a} กับ ${b} แล้วเหลือ [H⁺] = 10⁻${n} M`,t:'จงหาค่า pH หลังการสะเทิน',a:n},{d:`${site}: บัฟเฟอร์ถูกเติมกรดจนวัด [H⁺] = 10⁻${n} M`,t:'จงหาค่า pOH ที่ 25°C',a:14-n},{d:`${site}: ${salt} เกิดไฮโดรไลซิส ทำให้ [H⁺] = 10⁻${n} M`,t:'จงหาค่า pH ของสารละลาย',a:n}];return{title:'โจทย์บูรณาการ',data:modes[step].d,text:modes[step].t,ans:modes[step].a}}
function options(a){if(typeof a==='number')return [...new Set([a,Math.max(0,a-2),Math.min(14,a+1),a===7?9:7])].slice(0,3).sort(()=>Math.random()-.5);return [a,a.replace('⁻','⁻¹'),a.replace('10','10²')].sort(()=>Math.random()-.5)}function show(html){card.innerHTML=html;modal.style.display='grid';locked=true}function hide(){modal.style.display='none';locked=false}function startRoom(){show(`<div class="mini">ROOM ${level}</div><h2>ห้องทดลอง ${level}</h2><p>${level<11?'เริ่มจากข้อมูลตรงและสูตรพื้นฐาน':level<21?'เริ่มเชื่อมชนิดสารกับค่า pH/pOH':'เริ่มวิเคราะห์โจทย์หลายเงื่อนไข'}</p><div class="formula">${level>=24?'ด่านนี้ขวดปริศนาต้องใช้คีย์เวิร์ดจาก NPC':'ผ่าน 3 สถานีเพื่อปลดล็อกบันได'}</div><div class="actions"><button id="go">เริ่มภารกิจและเปิดเพลง</button></div>`);$('#go').onclick=()=>{hide();startMusic();tip.textContent='ไปที่สารตัวอย่าง A แล้วกด E หรือคลิก'}}function openStation(index){if(locked||index!==step)return;if(Math.hypot(pos.x-spots[index][0],pos.y-spots[index][1])>15){tip.textContent='เดินเข้าใกล้ขวดก่อน';return}let q=makeQ();if(q.need&&!clue){tip.textContent='โจทย์นี้ข้อมูลไม่ครบ—ไปคุยกับ ดร. ไอออน';return}let o=options(q.ans);show(`<div class="mini">ROOM ${level} · QUESTION ${step+1}/3</div><h2>${q.title}</h2><div class="formula">${q.data}</div><p>${q.text}</p><div class="actions">${o.map((v,i)=>`<button class="choice" data-v="${v}">${'ABC'[i]}. ${v}</button>`).join('')}</div><div id="fb" class="feedback"></div>`);document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>answer(b,q))}function answer(button,q){let all=document.querySelectorAll('[data-v]'),fb=$('#fb');all.forEach(x=>x.disabled=true);if(String(button.dataset.v)===String(q.ans)){button.classList.add('correct');fb.textContent='ถูกต้อง!';score+=100;$('#score').textContent=score;step++;$('#prog').textContent=step;document.querySelector(`[data-s="${step-1}"]`).classList.add('done');tone(660,.1,.08);setTimeout(()=>{hide();if(step===3){$('#stairs').classList.remove('locked');tip.textContent='ตอบครบสามข้อแล้ว! เดินไปบันได NEXT'}else tip.textContent='ยอดเยี่ยม! ไปที่สารตัวอย่าง '+['B','C'][step-1]},850)}else{button.classList.add('wrong');fb.textContent='ยังไม่ถูก ลองพิจารณาข้อมูลในโจทย์อีกครั้ง';tone(160,.12,.06);setTimeout(()=>{all.forEach(x=>{x.disabled=false;x.classList.remove('wrong')});fb.textContent='เลือกคำตอบใหม่ได้'},950)}}function talk(){if(locked||level<24||Math.hypot(pos.x-86,pos.y-75)>16)return;let q=makeQ();clue=true;show(`<div class="mini">NPC KEYWORD</div><h2>ดร. ไอออนให้ข้อมูลที่หายไป</h2><div class="formula">“${q.fact}”</div><p>นี่คือคีย์เวิร์ดสำคัญเพื่อใช้ตัดสินเงื่อนไขของขวดปริศนา ไม่ใช่เฉลยหรือขั้นตอนทำโจทย์</p><div class="actions"><button id="back">กลับไปที่ขวดปริศนา</button></div>`);$('#back').onclick=()=>{hide();tip.textContent='คุณมีคีย์เวิร์ดแล้ว ไปที่ขวดปริศนาได้'}}function next(){if(locked||step<3||Math.hypot(pos.x-91,pos.y-84)>16)return;if(level===30){show(`<div class="mini">MISSION COMPLETE</div><h2>ผ่านครบ 30 ห้อง! 🎉</h2><p>คุณแก้ครบ 90 โจทย์จากสถานการณ์ที่แตกต่างกัน พร้อมใช้คีย์เวิร์ด NPC เพื่อไขโจทย์ท้ายเกม</p><div class="formula">คะแนนรวม ${score}</div><div class="actions"><button id="again">เล่นใหม่</button></div>`);$('#again').onclick=()=>location.reload();return}level++;step=0;clue=false;$('#lv').textContent=level;$('#prog').textContent=0;document.querySelectorAll('.station').forEach(x=>x.classList.remove('done'));$('#stairs').classList.add('locked');$('#npc').classList.toggle('show',level>=24);pos={x:50,y:58};render();startRoom()}function render(){hero.style.left=pos.x+'%';hero.style.top=pos.y+'%'}function loop(){if(!locked){let dx=(keys.arrowright||keys.d?1:0)-(keys.arrowleft||keys.a?1:0),dy=(keys.arrowdown||keys.s?1:0)-(keys.arrowup||keys.w?1:0);if(dx||dy){let z=Math.hypot(dx,dy);pos.x=Math.max(6,Math.min(94,pos.x+dx/z*.25));pos.y=Math.max(16,Math.min(88,pos.y+dy/z*.25));render()}}requestAnimationFrame(loop)}document.addEventListener('keydown',e=>{let k=e.key.toLowerCase();if(['arrowup','arrowdown','arrowleft','arrowright','w','a','s','d'].includes(k)){keys[k]=true;e.preventDefault()}if(k==='e'){spots.forEach((s,i)=>{if(Math.hypot(pos.x-s[0],pos.y-s[1])<15)openStation(i)});talk();next()}});document.addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);document.querySelectorAll('.station').forEach(x=>x.onclick=()=>openStation(+x.dataset.s));$('#npc').onclick=talk;$('#stairs').onclick=next;function tone(freq,d=.1,v=.04){if(!ctx)return;let o=ctx.createOscillator(),g=ctx.createGain();o.type='square';o.frequency.value=freq;g.gain.setValueAtTime(v,ctx.currentTime);g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+d);o.connect(g).connect(ctx.destination);o.start();o.stop(ctx.currentTime+d)}function startMusic(){if(!ctx)ctx=new(window.AudioContext||window.webkitAudioContext)();ctx.resume();if(!musicTimer){let tune=[523,0,659,784,659,0,523,0,587,0,698,880,698,0,587,0],i=0;musicTimer=setInterval(()=>{let n=tune[i++%tune.length];if(n)tone(n,.1,.035)},145)}$('#music').textContent='♫ เพลง: เปิด'}$('#music').onclick=()=>{if(musicTimer){clearInterval(musicTimer);musicTimer=null;$('#music').textContent='♫ เพลง: ปิด'}else startMusic()};$('#npc').classList.toggle('show',level>=24);startRoom();render();loop();
</script></body></html>
